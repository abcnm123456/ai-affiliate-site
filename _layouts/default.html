<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.7;
            color: #333;
            background: #f5f5f5;
        }
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        header h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
        header a { color: white; text-decoration: none; }
        nav { margin-top: 1rem; }
        nav a { color: rgba(255,255,255,0.8); margin: 0 1rem; text-decoration: none; }
        nav a:hover { color: white; }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 1rem;
        }
        footer {
            text-align: center;
            padding: 2rem;
            color: #666;
            margin-top: 2rem;
        }
        footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <header>
        <h1><a href="/ai-affiliate-site/">🤖 AI Tools Review</a></h1>
        <nav>
            <a href="/ai-affiliate-site/">首頁</a>
            <a href="/ai-affiliate-site/about/">關於</a>
        </nav>
    </header>

    <div class="container">
        {{ content }}
    </div>

    <footer>
        <p>© 2025 AI Tools Review |
        <a href="/ai-affiliate-site/about/">關於我們</a></p>
    </footer>
</body>
</html>
